version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash_user
      POSTGRES_PASSWORD: unleash_password
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "unleash", "-U", "unleash_user"]
      interval: 2s
      timeout: 1s
      retries: 30

  web:
    image: unleashorg/unleash-server:latest
    ports:
      - "4242:4242"
    environment:
      DATABASE_URL: postgres://unleash_user:unleash_password@db:5432/unleash
      DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
