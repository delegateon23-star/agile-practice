name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build stage
        run: node app.js

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Test stage
        run: echo "Tests passed"

  release:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Release gate
        run: echo "Build and tests passed - ready for release"